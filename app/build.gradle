plugins { id 'com.android.application' }
android {
    namespace 'it.edo.codecprobe'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'it.edo.codecprobe'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '0.11'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -fexceptions' }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
