plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'it.edo.codecprobe'
    buildFeatures { buildConfig true; compose true }
    compileSdk 37
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'it.edo.codecprobe'
        minSdk 29
        targetSdk 35
        versionCode 105
        versionName '1.05'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -fexceptions' }
        }
    }
    signingConfigs {
        permanent {
            def signingPath = System.getenv('CODECPROBE_STORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('CODECPROBE_STORE_PASSWORD')
                keyAlias 'codecprobe'
                keyPassword System.getenv('CODECPROBE_STORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('CODECPROBE_STORE_FILE')) signingConfig signingConfigs.permanent
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Render tests create previews consumed by emit-ui-previews.py. Cache them with the test results.
            outputs.dir(project.layout.buildDirectory.dir('reports/ui'))
            testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    // UI versions aligned with Morphe; codecs, target SDK and application identity stay independent.
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-beta02'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'dev.chrisbanes.haze:haze:2.0.1'
    implementation 'dev.chrisbanes.haze:haze-blur:2.0.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation platform('androidx.compose:compose-bom:2026.09.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.77.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.77.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

