plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'it.edo.codecprobe'
    buildFeatures { buildConfig true; compose true }
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'it.edo.codecprobe'
        minSdk 29
        targetSdk 35
        versionCode 103
        versionName '1.03'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -fexceptions' }
        }
    }
    signingConfigs {
        permanent {
            def signingPath = System.getenv('CODECPROBE_STORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('CODECPROBE_STORE_PASSWORD')
                keyAlias 'codecprobe'
                keyPassword System.getenv('CODECPROBE_STORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('CODECPROBE_STORE_FILE')) signingConfig signingConfigs.permanent
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Render tests create previews consumed by emit-ui-previews.py. Cache them with the test results.
            outputs.dir(project.layout.buildDirectory.dir('reports/ui'))
            testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
        }
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pinned together for AGP 8.9 / compileSdk 35; no codec/toolchain migration required.
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'dev.chrisbanes.haze:haze:1.5.2'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    testImplementation platform('androidx.compose:compose-bom:2025.04.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.43.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.43.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

