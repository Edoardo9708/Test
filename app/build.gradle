plugins { id 'com.android.application' }
android {
    namespace 'it.edo.codecprobe'
    buildFeatures { buildConfig true }
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'it.edo.codecprobe'
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName '0.24'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -fexceptions' }
        }
    }
    signingConfigs {
        permanent {
            def signingPath = System.getenv('CODECPROBE_STORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('CODECPROBE_STORE_PASSWORD')
                keyAlias 'codecprobe'
                keyPassword System.getenv('CODECPROBE_STORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('CODECPROBE_STORE_FILE')) signingConfig signingConfigs.permanent
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}







