name: Build APK
on:
  push:
    branches: [main, 'ui/**']
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - LICENSE.md
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run native SDR, ARM64 and HDR smoke tests too'
        type: boolean
        default: true
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  scope:
    name: Select relevant checks
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify test selection rules
        run: |
          python3 -m unittest discover -s tests -p test_ci_scope.py -v
          python3 -m unittest discover -s tests -p test_ci_native_key.py -v
      - name: Find last successfully verified push
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified_sha=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs" -f branch="${GITHUB_REF_NAME}" -f event=push -f status=success -f per_page=1 --jq '.workflow_runs[0].head_sha // ""') || verified_sha=""
          echo "sha=${verified_sha:-0000000000000000000000000000000000000000}" >> "$GITHUB_OUTPUT"
      - name: Select checks since the last verified push
        id: scope
        env:
          CI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: python3 scripts/ci-scope.py
  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded Ubuntu package downloads
        run: bash scripts/prepare-ci-apt.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify YUV plane packing
        run: bash scripts/test-yuv.sh
      - name: Fingerprint native build inputs
        id: native-key
        run: python3 scripts/ci-native-key.py
      - name: Restore native sources and CMake compilation
        id: native-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-native-v2-${{ steps.native-key.outputs.key }}
          path: |
            vendor
            app/.cxx
            app/build/intermediates/cxx
            ${{ steps.native-key.outputs.ndk }}
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned x265 source and license
        run: bash scripts/prepare-x265.sh
      - name: Prepare pinned audio libraries and licenses
        run: bash scripts/prepare-audio.sh
      - name: Prepare pinned software video decoder and license
        run: bash scripts/prepare-video.sh
      - name: Prepare pinned HEIC container and license
        run: bash scripts/prepare-images.sh
      - name: Restore permanent APK signing key
        id: signing
        env:
          CODECPROBE_SIGNING_JSON: ${{ secrets.CODECPROBE_SIGNING_JSON }}
        run: python3 scripts/restore-signing.py
      - name: Compile Java, run unit tests and lint before native compilation
        run: gradle --no-daemon --build-cache :app:testDebugUnitTest :app:lintDebug
      - name: Upload Java test, lint and UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Application-checks
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.*
            app/build/reports/ui
      - name: Build installable APK
        run: gradle --no-daemon --build-cache :app:assembleDebug
      - name: Render synthetic Home UI previews
        run: python3 scripts/emit-ui-previews.py
      - name: Verify permanent APK signature
        if: steps.signing.outputs.ready == 'true'
        run: python3 scripts/verify-signing.py
      - name: Verify native optimization and APK architecture
        run: python3 scripts/verify-native-build.py
      - name: Name APK with built app version
        id: package
        run: |
          python3 scripts/package-apk.py
          python3 scripts/verify-version.py
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: v${{ steps.package.outputs.version }}-CodecProbe-APK
          overwrite: true
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
      - name: Package corresponding source
        run: tar --exclude=.git --exclude=.gradle --exclude=.cxx --exclude=app/build --exclude=native-smoke --exclude=arm-smoke --exclude=audio-smoke --exclude=yuv-test --exclude=CodecProbe-source.tar.gz -czf CodecProbe-source.tar.gz app scripts tests vendor build.gradle settings.gradle gradle.properties README.md docs .github
      - uses: actions/upload-artifact@v4
        with:
          name: v${{ steps.package.outputs.version }}-CodecProbe-source
          overwrite: true
          path: CodecProbe-source.tar.gz
      - name: Build and run native software smoke test
        if: needs.scope.outputs.native == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          cmake -S app/src/main/cpp -B native-smoke -DCMAKE_BUILD_TYPE=Release
          cmake --build native-smoke -j2
          native-smoke/x265probe_smoke > native-smoke.log 2>&1
          tail -n 5 native-smoke.log
          for crf in 24 32; do
            ffmpeg -v error -xerror -i "smoke-${crf}.hevc" -f null -
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames -of json "smoke-${crf}.hevc" > "smoke-${crf}.json"
          done
          python3 scripts/verify-smoke.py
      - name: Run ARM64 assembly encode and decode smoke test
        if: needs.scope.outputs.native == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
          cmake -S app/src/main/cpp -B arm-smoke -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          cmake --build arm-smoke -j2
          timeout 180 qemu-aarch64 -L /usr/aarch64-linux-gnu arm-smoke/x265probe_smoke > arm-smoke.log 2>&1
          tail -n 8 arm-smoke.log
          for crf in 24 32; do
            ffmpeg -v error -xerror -i "smoke-${crf}.hevc" -f null -
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames -of json "smoke-${crf}.hevc" > "smoke-${crf}.json"
          done
          python3 scripts/verify-smoke.py
      - name: Verify separate ten-bit HDR encoder
        if: needs.scope.outputs.native == 'true'
        run: |
          cmake -S app/src/main/cpp/hdr -B hdr-smoke
          cmake --build hdr-smoke --parallel 2
          hdr-smoke/hdr10_smoke > hdr-smoke.log 2>&1
          python3 scripts/verify-hdr-smoke.py
          java -cp yuv-test it.edo.codecprobe.HdrNativeMetadataCheck
          ffmpeg -v error -xerror -i hdr10-preserved.hevc -f null -
          ffmpeg -v error -i hdr10-preserved.hevc -c copy -avoid_negative_ts make_zero hdr10-preserved.mp4
          python3 scripts/verify-hdr-metadata.py
          java -cp yuv-test it.edo.codecprobe.HdrHeaderCheck hdr10-16.hevc 16
          java -cp yuv-test it.edo.codecprobe.HdrHeaderCheck hdr10-18.hevc 18
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.native == 'true'
        with:
          name: Native-smoke-log
          path: |
            native-smoke.log
            arm-smoke.log
            hdr-smoke.log



  audio-native:
    name: Audio conversion smoke
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded Ubuntu package downloads
        run: bash scripts/prepare-ci-apt.sh
      - name: Install decoder used for independent verification
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare pinned audio libraries
        run: bash scripts/prepare-audio.sh
      - name: Encode and independently decode audio fixtures
        run: bash scripts/test-audio-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audio-smoke-log
          path: audio-fixtures/*.log

  images-native:
    name: JPEG to HEIC conversion smoke
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded Ubuntu package downloads
        run: bash scripts/prepare-ci-apt.sh
      - name: Install fixture and comparison tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil
      - name: Prepare pinned image libraries
        run: |
          bash scripts/prepare-x265.sh
          bash scripts/prepare-video.sh
          bash scripts/prepare-images.sh
      - name: Encode, decode and verify HEIC fixtures
        run: bash scripts/test-images-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Images-smoke-log
          path: |
            image-fixtures/**/*.log
            image-fixtures/*.log
            image-host-build/image_smoke

  video-decoder:
    name: Software HEVC decoder smoke
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded Ubuntu package downloads
        run: bash scripts/prepare-ci-apt.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install independent fixture encoder and decoder
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify bundled decoder against real PQ and HLG packets
        run: bash scripts/test-video-decoder.sh
